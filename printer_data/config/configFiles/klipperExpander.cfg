# Firmware setup
# https://github.com/VoronDesign/Voron-Hardware/blob/master/Klipper_Expander/Documentation/Setup_and_Flashing_Guide.md
#

##############################################################################################################################################
## MCU
##############################################################################################################################################

[mcu expander]
serial: /dev/serial/by-id/usb-Klipper_stm32f042x6_080025001343305645303820-if00
restart_method: command
# Firmware setup
# https://github.com/VoronDesign/Voron-Hardware/blob/master/Klipper_Expander/Documentation/Setup_and_Flashing_Guide.md
#

##############################################################################################################################################
## Fans
##############################################################################################################################################
[fan_generic Nevermore]
pin: expander:PA1
max_power: 1.00
cycle_time: 0.025       # DO NOT go below this; higher stops timing errors
hardware_pwm: false     # MANDATORY for STM32F042 MCUs
shutdown_speed: 0.00
kick_start_time: 0.3
off_below: 0.18


##############################################################################################################################################
## Use to configure ONLY
##############################################################################################################################################
# Works: skr mini muc temp controlled fan
# [fan_generic electronics_fan]
# pin:  expander:PA0
# max_power: 1.00
# cycle_time: 0.010       # DO NOT go below this; higher stops timing errors
# hardware_pwm: false     # MANDATORY for STM32F042 MCUs
# shutdown_speed: 0.00
# kick_start_time: 0.2
# off_below: 0.12


# [fan_generic stepper_driver_fan]
# pin: expander:PA2  # <-- IMPORTANT: Change this to your fan's signal pin
# max_power: 1.00
# cycle_time: 0.010       # DO NOT go below this; higher stops timing errors
# hardware_pwm: false     # MANDATORY for STM32F042 MCUs
# shutdown_speed: 0.00
# kick_start_time: 0.2
# off_below: 0.12
##############################################################################################################################################
## Use to configure ENDS
##############################################################################################################################################


[fan]
pin: expander:PA3
max_power: 1.0
cycle_time: 0.010       # DO NOT go below this; higher stops timing errors
hardware_pwm: false     # MANDATORY for STM32F042 MCUs
shutdown_speed: 0.00
kick_start_time: 0.2    # 300ms is enough to break stiction without wasting power
off_below: 0.09         # Prevents Klipper from trying to run the fan below 15% where it stalls

# Works: skr mini muc temp controlled fan
[temperature_fan electronics_fan]
pin:  expander:PA0
max_power: 1.00
sensor_type: temperature_mcu
sensor_mcu: mcu
control: watermark
max_delta: 3.0
min_temp: 0
max_temp: 70
target_temp: 35
max_speed: 0.6
shutdown_speed: 0.0
cycle_time: 0.025       # DO NOT go below this; higher stops timing errors
hardware_pwm: false     # MANDATORY for STM32F042 MCUs
kick_start_time: 0.2    # 300ms is enough to break stiction without wasting power
off_below: 0.12         # Prevents Klipper from trying to run the fan below 15% where it stalls


[controller_fan stepper_driver_fan]
pin: expander:PA2  # <-- IMPORTANT: Change this to your fan's signal pin
stepper: stepper_x, stepper_y, stepper_z, extruder
# Add any other steppers you want to monitor (e.g., stepper_z1, extruder1)
idle_timeout: 30
idle_speed: 0.5
# The fan will stay on for 30 seconds after the steppers disable.
# You can change this time or remove the line to use the 30s default.
max_power: 1.00
cycle_time: 0.025       # DO NOT go below this; higher stops timing errors
hardware_pwm: false     # MANDATORY for STM32F042 MCUs
shutdown_speed: 1.0
kick_start_time: 0.2    # 300ms is enough to break stiction without wasting power
off_below: 0.12         # Prevents Klipper from trying to run the fan below 15% where it stalls



##############################################################################################################################################
## Sensors
##############################################################################################################################################

[static_digital_output onboardLED]
pins: !expander:PA4

[temperature_sensor Chamber_Temp]
sensor_type: Generic 3950 ### < ADD YOUR OWN SENSOR TYPE HERE
sensor_pin: expander:PA6 ### < ADD YOUR OWN PIN HERE
min_temp: 5
max_temp: 60
gcode_id: CH

[temperature_sensor expander_mcu]
sensor_type: temperature_mcu
sensor_mcu: expander
min_temp: 0
max_temp: 100