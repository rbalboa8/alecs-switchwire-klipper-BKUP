###################################################################################
# Safe Z (Use if not using DKEU)
###################################################################################
[safe_z_home]
home_xy_position: 110, 110   # Set to your bed center (X, Y) or physical Z endstop switch coordinates
speed: 80.0                  # XY travel speed to reach the safe home coordinates (mm/s)
z_hop: 10.0                  # Lift Z by 10mm before homing XY to avoid dragging the nozzle
z_hop_speed: 15.0            # Z lift speed (mm/s)
move_to_previous: False      # Optional: set to True if you want XY to return to previous position after Z homing